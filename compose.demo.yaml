name: gmoney-v2-demo

services:
  paddleocr-vl:
    image: ghcr.io/ggml-org/llama.cpp:server@sha256:84d3d48839dc645bd85affa2738f447179fbda4e356c5b40942cf2a9463fe779
    command:
      - --model
      - /models/PaddleOCR-VL-1.6-GGUF.gguf
      - --mmproj
      - /models/PaddleOCR-VL-1.6-GGUF-mmproj.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8111"
      - --ctx-size
      - "24576"
      - --parallel
      - "2"
      - --threads
      - "14"
      - --temp
      - "0"
    volumes:
      - /home/azureuser/gmoneyv2-runtime/model-cache/paddleocr-vl-1.6:/models:ro
    ports:
      - "127.0.0.1:8111:8111"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8111/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 56G

  api:
    image: gmoney-v2-api:${GMONEY_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
      args:
        GMONEY_BUILD_REVISION: "${GMONEY_BUILD_REVISION:-unknown}"
        GMONEY_REQUIRE_BUILD_REVISION: "${GMONEY_REQUIRE_BUILD_REVISION:-0}"
    command: ["uvicorn", "gmoney.demo.api:app", "--host", "0.0.0.0", "--port", "8000"]
    user: "10001:10001"
    environment:
      GMONEY_DEMO_ROOT: /runtime
      GMONEY_MAX_ACTIVE_JOBS: "20"
      GMONEY_MAX_UPLOAD_BYTES: "0"
      GMONEY_MAX_PDF_PAGES: "200"
      GMONEY_WORKER_CAPACITY: "2"
      GMONEY_RETENTION_HOURS: "720"
      GMONEY_MIN_FREE_BYTES: "${GMONEY_MIN_FREE_BYTES:-21474836480}"
      GMONEY_PROFILE_REGISTRY: /profiles/registry.json
      GMONEY_PROFILE_REGISTRY_LOCK: /runtime-config/profile-registry.lock
      GMONEY_ALIAS_REGISTRY: /runtime-config/alias-registry.json
      GMONEY_WORKER_STATUS_PATH: /runtime-config/worker-status.json
    volumes:
      - ${GMONEY_DATA_ROOT:-/home/azureuser/gmoneyv2-runtime}/jobs:/runtime/jobs
      - ${GMONEY_PROFILE_ROOT:-/home/azureuser/gmoneyv2-runtime/profiles}:/profiles:ro
      - ${GMONEY_DATA_ROOT:-/home/azureuser/gmoneyv2-runtime}/config:/runtime-config
    ports:
      - "127.0.0.1:8100:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v2/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12

  profile-admin:
    profiles: ["admin"]
    image: gmoney-v2-api:${GMONEY_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
      args:
        GMONEY_BUILD_REVISION: "${GMONEY_BUILD_REVISION:-unknown}"
        GMONEY_REQUIRE_BUILD_REVISION: "${GMONEY_REQUIRE_BUILD_REVISION:-0}"
    entrypoint: ["gmoney-profiles"]
    user: "10001:10001"
    environment:
      GMONEY_PROFILE_REGISTRY: /profiles/registry.json
      GMONEY_PROFILE_REGISTRY_LOCK: /runtime-config/profile-registry.lock
      GMONEY_ALIAS_REGISTRY: /runtime-config/alias-registry.json
      GMONEY_JOBS_ROOT: /runtime/jobs
    volumes:
      - ${GMONEY_DATA_ROOT:-/home/azureuser/gmoneyv2-runtime}/jobs:/runtime/jobs
      - ${GMONEY_PROFILE_ROOT:-/home/azureuser/gmoneyv2-runtime/profiles}:/profiles
      - ${GMONEY_DATA_ROOT:-/home/azureuser/gmoneyv2-runtime}/config:/runtime-config

  worker:
    image: gmoney-v2-worker:${GMONEY_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: infra/docker/inference-cpu.Dockerfile
      args:
        GMONEY_BUILD_REVISION: "${GMONEY_BUILD_REVISION:-unknown}"
        GMONEY_REQUIRE_BUILD_REVISION: "${GMONEY_REQUIRE_BUILD_REVISION:-0}"
    entrypoint: ["python", "-m", "gmoney.demo.worker"]
    user: "10001:10001"
    depends_on:
      paddleocr-vl:
        condition: service_healthy
    environment:
      HOME: /home/modelworker
      FLAGS_use_mkldnn: "0"
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      FLAGS_paddle_num_threads: "4"
      GMONEY_DEMO_ROOT: /runtime
      GMONEY_VL_URL: http://paddleocr-vl:8111
      GMONEY_WORKER_CONCURRENCY: "2"
      GMONEY_RETENTION_HOURS: "720"
      GMONEY_PROFILE_REGISTRY: /profiles/registry.json
      GMONEY_PROFILE_REGISTRY_LOCK: /runtime-config/profile-registry.lock
      GMONEY_ALIAS_REGISTRY: /runtime-config/alias-registry.json
      GMONEY_WORKER_STATUS_PATH: /runtime-config/worker-status.json
    volumes:
      - ${GMONEY_DATA_ROOT:-/home/azureuser/gmoneyv2-runtime}/jobs:/runtime/jobs
      - ${GMONEY_PROFILE_ROOT:-/home/azureuser/gmoneyv2-runtime/profiles}:/profiles:ro
      - /home/azureuser/gmoneyv2-runtime/model-cache:/home/modelworker/.paddlex
      - ${GMONEY_DATA_ROOT:-/home/azureuser/gmoneyv2-runtime}/config:/runtime-config
    restart: unless-stopped
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          memory: 24G

  frontend:
    image: gmoney-v2-frontend:${GMONEY_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
      args:
        GMONEY_BUILD_REVISION: "${GMONEY_BUILD_REVISION:-unknown}"
        GMONEY_REQUIRE_BUILD_REVISION: "${GMONEY_REQUIRE_BUILD_REVISION:-0}"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    volumes:
      - ./infra/nginx/demo.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "3100:8080"
    restart: unless-stopped
