[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gmoney-v2"
version = "0.1.0"
description = "Evidence-grounded hospital bill extraction platform"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "google-genai>=1.56,<2",
  "httpx>=0.28,<1",
  "numpy>=2.2,<3",
  "opencv-python-headless>=4.11,<5",
  "pillow>=11,<13",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pymupdf>=1.26,<2",
  "python-multipart>=0.0.20,<1",
  "typer>=0.15,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.130,<7",
  "httpx2>=2.5,<3",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]
inference-cpu = [
  "huggingface-hub>=1,<2",
  "paddleocr==3.7.0",
  "paddlepaddle==3.2.2",
  "paddlex[ocr]==3.7.2",
  "psutil>=7,<8",
]
inference-gpu = [
  "huggingface-hub>=1,<2",
  "paddleocr==3.7.0",
  "paddlex[ocr]==3.7.2",
  "psutil>=7,<8",
]

[project.scripts]
gmoney-corpus = "gmoney.evaluation.corpus:app"
gmoney-evaluate = "gmoney.evaluation.cli:app"
gmoney-evaluate-fields = "gmoney.evaluation.field_cli:app"
gmoney-geometry = "gmoney.geometry.cli:app"
gmoney-benchmark = "gmoney.inference.benchmark:app"
gmoney-layout-bakeoff = "gmoney.inference.layout_bakeoff:app"
gmoney-ocr-fallback = "gmoney.inference.ocr_fallback_cli:app"
gmoney-offline-extract = "gmoney.extraction.offline:app"
gmoney-demo-worker = "gmoney.demo.worker:main"
gmoney-demo-import = "gmoney.demo.import_history:app"
gmoney-demo-backfill-totals = "gmoney.demo.backfill_totals:app"
gmoney-demo-reprocess = "gmoney.demo.reprocess:app"
gmoney-profiles = "gmoney.profiles.cli:app"
gmoney-phase3-evaluate = "gmoney.evaluation.phase3_cli:app"
gmoney-release-corpus = "gmoney.evaluation.release_gate:app"
gmoney-recertify = "gmoney.demo.recertify:app"

[tool.hatch.build.targets.wheel]
packages = ["src/gmoney"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
