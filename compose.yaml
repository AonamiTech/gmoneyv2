name: gmoney-v2

services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: gmoney
      POSTGRES_PASSWORD: gmoney
      POSTGRES_DB: gmoney
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gmoney -d gmoney"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${GMONEY_S3_ACCESS_KEY:-gmoney}
      MINIO_ROOT_PASSWORD: ${GMONEY_S3_SECRET_KEY:-change-me}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - minio-data:/data

  temporal:
    image: temporalio/auto-setup:1.27.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: gmoney
      POSTGRES_PWD: gmoney
      POSTGRES_SEEDS: postgres
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:2.34.0
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "8088:8080"

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
      args:
        GMONEY_BUILD_REVISION: "${GMONEY_BUILD_REVISION:-unknown}"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      temporal:
        condition: service_started
    environment:
      GMONEY_ENV: development
      GMONEY_TENANT_ID: development
      GMONEY_DATABASE_URL: postgresql+asyncpg://gmoney:gmoney@postgres:5432/gmoney
      GMONEY_TEMPORAL_TARGET: temporal:7233
      GMONEY_S3_ENDPOINT: http://minio:9000
      GMONEY_S3_ACCESS_KEY: ${GMONEY_S3_ACCESS_KEY:-gmoney}
      GMONEY_S3_SECRET_KEY: ${GMONEY_S3_SECRET_KEY:-change-me}
      GMONEY_S3_BUCKET: gmoney-v2
    ports:
      - "8000:8000"

volumes:
  postgres-data:
  minio-data:
